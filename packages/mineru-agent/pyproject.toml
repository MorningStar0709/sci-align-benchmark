[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mineru-agent"
version = "0.1.0"
description = "MinerU agent framework — intent routing, resource scheduling, capability validation."
requires-python = ">=3.11,<3.12"
dependencies = [
  "mineru-core>=0.1.0",
  "numpy>=1.24.0",
  "anthropic>=0.40",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mineru_agent*"]
