[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mineru-api"
version = "0.1.0"
description = "MinerU FastAPI application server."
requires-python = ">=3.11,<3.12"
dependencies = [
  "mineru-core>=0.1.0",
  "mineru-medical>=0.1.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mineru_api*"]
