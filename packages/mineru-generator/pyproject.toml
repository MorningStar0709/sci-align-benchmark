[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mineru-generator"
version = "0.1.0"
description = "MinerU data generator — synthetic data generation, prompt templates, quality filters."
requires-python = ">=3.11,<3.12"
dependencies = [
  "anthropic>=0.40",
  "mineru-core>=0.1.0",
  "openai>=1.3.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mineru_generator*"]
