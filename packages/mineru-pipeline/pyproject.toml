[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mineru-pipeline"
version = "0.1.0"
description = "MinerU data pipeline scripts (T1-T3 corpus building)."
requires-python = ">=3.11,<3.12"
dependencies = [
  "mineru-core>=0.1.0",
  "httpx>=0.27.0",
  "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mineru_pipeline*"]
